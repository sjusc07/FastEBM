[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "FastEBM"
version = "0.1.0"
description = "FastEBM implementation"
authors = [
    { name = "Shayan Javid" }
]
readme = "README.md"
requires-python = ">=3.9.18"
dependencies = [
    "numpy>=1.26.4",
    "scikit-learn>=1.6.1",
    "pandas>=2.2.3",
    "scipy>=1.12.0",
    "statsmodels>=0.14.4",
    "matplotlib>=3.9.4",
    "ruptures>=1.1.9"
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]